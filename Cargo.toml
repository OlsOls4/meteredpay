[package]
name = "meteredpay"
description = "MeteredPay: seller-side pay-per-call on NEAR testnet. Buyer prepays, contract holds per-call price, deducts only on a buyer-verified, payer-signed success receipt, refuses over-budget calls on-chain, releases held amounts on failure/timeout. Testnet only."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
# No repository URL yet: the submission repo stays local-only until Olly
# explicitly approves making it public. Do not add a remote here.

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, according to specs
# in https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
# docker image, descriptor of build environment
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
# tag after colon above serves only descriptive purpose; image is identified by digest
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
# list of environment variables names, whose values, if set, will be used as external build parameters
# in a reproducible manner
# supported by `sourcescan/cargo-near:0.10.1-rust-1.82.0` image or later images
passed_env = []
# build command inside of docker container
# if docker image from default gallery is used https://hub.docker.com/r/sourcescan/cargo-near/tags,
# the command may be any combination of flags of `cargo-near`,
# supported by respective version of binary inside the container besides `--no-locked` flag
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
near-sdk = "5.29"
base64 = "0.22"
bs58 = "0.5"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-sandbox = "0.3.12"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true

# `cfg(near)` was introduced in `near-sdk` v5.27.0, and is expected cfg now
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
